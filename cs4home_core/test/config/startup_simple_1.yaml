master_1:
  ros__parameters:
    flows: [flow_1]
    flow_1: [cognitive_module_1, cognitive_module_2]

cognitive_module_1:
  ros__parameters:
    core: image_filter
    afferent: simple_image_input
    simple_image_input:
      topics: ["/image_raw", "/camera_info"]
      types: ["sensor_msgs/msg/Image", "sensor_msgs/msg/CameraInfo"]
    efferent: simple_image_output
    simple_image_output:
      topics: ["/detections"]
      types: ["sensor_msgs/msg/Image"]
    meta: default_meta
    coupling: default_coupling

cognitive_module_2:
  ros__parameters:
    core: image_filter
    afferent: simple_image_input
    simple_image_input:
      topics: ["/detections"]
      types: ["sensor_msgs/msg/Image"]
    efferent: simple_image_output
    simple_image_output:
      topics: ["/detections2"]
      types: ["sensor_msgs/msg/Image"]
    meta: default_meta
    coupling: default_coupling
